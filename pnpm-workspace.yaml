packages:
  - apps/*
  - packages/*

# Segurança da cadeia de suprimentos (docs/SECURITY.md §15):
# - scripts de instalação de dependências bloqueados por padrão (pnpm 10),
#   liberados apenas para os pacotes abaixo;
# - versões publicadas há menos de 24h não são adotadas automaticamente.
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

minimumReleaseAge: 1440

# Correções de segurança em dependências transitivas (pnpm audit), todas vindas
# do CLI do Prisma 7.10: deepmerge-ts e effect (@prisma/config), mysql2 e
# fast-uri (usados só pelo comando `prisma dev`, que o projeto não utiliza).
# Remover quando o Prisma publicar versões já corrigidas.
overrides:
  deepmerge-ts: '>=8.0.0'
  effect: '>=3.22.1 <4'
  fast-uri: '>=3.1.9 <4'
  mysql2: '>=3.23.1 <4'
