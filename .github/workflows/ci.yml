# CI da Docline SDR (docs/ARCHITECTURE.md §12.4).
# Actions fixadas por SHA de commit (docs/SECURITY.md §15).
name: CI

# Todo push (em qualquer branch, inclusive as de PR) e execução manual.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DATABASE_URL_TEST: postgresql://docline:docline@localhost:5432/docline_sdr_test
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, tipos, testes e migrações
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Espelho oficial da imagem no ECR Public: o Docker Hub limita downloads
        # anônimos e derrubava o job antes de qualquer teste.
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: docline
          POSTGRES_PASSWORD: docline
          POSTGRES_DB: docline_sdr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U docline -d docline_sdr_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Testes unitários
        run: pnpm test
      # Conjunto fictício com o provedor falso: sem custo e sem chave (docs/AI-SDR.md §14).
      - name: Avaliação offline da IA (provedor falso)
        run: pnpm ai:eval --out .ai-eval/ci
      - name: Testes de integração (PostgreSQL)
        run: pnpm test:int
      - name: Schema e migrações em sincronia
        run: pnpm db:check
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - name: Vulnerabilidades em dependências de produção
        run: pnpm audit --prod --audit-level high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine # mesmo espelho (ver acima)
        env:
          POSTGRES_USER: docline
          POSTGRES_PASSWORD: docline
          POSTGRES_DB: docline_sdr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U docline -d docline_sdr_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navegador do Playwright
        run: pnpm --filter @docline/web exec playwright install --with-deps chromium
      - name: Build de produção do web
        run: pnpm --filter @docline/web build
      - name: Jornadas E2E (web + worker)
        run: pnpm test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Varredura de segredos (histórico completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (binário com checksum verificado)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build da imagem (sem publicar)
        run: >-
          docker build
          --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:22-bookworm-slim
          --tag docline-sdr:ci .
