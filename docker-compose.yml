# Ambiente local de desenvolvimento (docs/ARCHITECTURE.md §14.1).
# Uso: docker compose up -d
# Somente dados fictícios. Nunca aponte para bancos de produção.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docline
      POSTGRES_PASSWORD: docline
      POSTGRES_DB: docline_sdr
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docline -d docline_sdr']
      interval: 5s
      timeout: 3s
      retries: 10

  # Captura os e-mails enviados em desenvolvimento (convites, redefinição de senha).
  # Interface web: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
